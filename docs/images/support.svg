<svg xmlns="http://www.w3.org/2000/svg" width="232" height="48" viewBox="0 0 232 48" role="img" aria-label="Support Seaglass on Ko-fi">
  <title>Support Seaglass on Ko-fi</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4a52"/>
      <stop offset="1" stop-color="#0a1d3d"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="0.55" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#f2575f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14a39a" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M18 19h17v6a8.5 8.5 0 0 1-8.5 8.5a8.5 8.5 0 0 1-8.5-8.5z"/>
    </clipPath>
  </defs>
  <rect x="0.75" y="0.75" width="230.5" height="46.5" rx="23.25" fill="url(#water)" stroke="url(#ember)" stroke-width="1.5"/>
  <!-- a sea glass cup of coffee with an ember heart, its steam rising -->
  <path d="M22.5 15.5c-1.4-1.6 1.4-2.8 0-4.4M27 15.5c-1.4-1.6 1.4-2.8 0-4.4M31.5 15.5c-1.4-1.6 1.4-2.8 0-4.4" fill="none"
        stroke="#a3c4c4" stroke-width="1.4" stroke-linecap="round"/>
  <g clip-path="url(#inside)">
    <rect x="16" y="22" width="22" height="14" fill="#5a2e16"/>
    <rect x="16" y="21.4" width="22" height="1.4" fill="#d9a066"/>
  </g>
  <path d="M35 21.5h1.6a3.6 3.6 0 0 1 0 7.2h-2.2" fill="none" stroke="#5fe6cb" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18 19h17v6a8.5 8.5 0 0 1-8.5 8.5a8.5 8.5 0 0 1-8.5-8.5z" fill="url(#glass)" stroke="#5fe6cb" stroke-width="1.2"/>
  <path d="M26.5 30.2c-2.6-1.6-3.7-2.9-3.7-4.1a1.75 1.75 0 0 1 3.7-0.6a1.75 1.75 0 0 1 3.7 0.6c0 1.2-1.1 2.5-3.7 4.1z"
