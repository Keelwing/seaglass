  <ellipse cx="26.5" cy="36" rx="11" ry="1.6" fill="#7ff0d8" fill-opacity="0.3"/>
  <text x="50" y="30" fill="#eef8f6" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
