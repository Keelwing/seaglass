# Checks on every push and pull request, with the same make targets as on a development machine: the unit tests,
# the static checks (qmllint, shellcheck, actionlint, the Python byte compiler, glslangValidator for the shaders),
# the package, and the site (its links checked; pages.yml publishes it from main). Each Sailfish OS version is
# checked by a workflow of its own (sailfish-VERSION.yml, steps in sailfish.yml), for a badge of its own in
# README.md. The harness and the phone's own check (make check-hook) need a phone, and run only there.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: make test
      - name: Static checks
        run: make lint
      - name: Package
        run: make rpm
      - name: Site
        run: make site
      - uses: actions/upload-artifact@v7
        with:
          name: seaglass-rpm
          path: out/rpm/*.noarch.rpm
          if-no-files-found: error
