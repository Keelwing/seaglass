# One Sailfish OS version of patchmanager/versions, called by that version's own workflow (sailfish-VERSION.yml), so
# that each version has a status badge of its own in README.md. The hook against that release's stock home screen,
# downloaded from Jolla and never uploaded (make check-hook VERSION=...); and where Jolla publishes an SDK build
# target for the series, our QML compiled with that release's own Qt and Silica (make qml-check TARGET=...). The
# phone's own checks (the harness, make check-hook without a version) need a phone, and run only there.
name: sailfish

on:
  workflow_call:
    inputs:
      version:
        description: "A Sailfish OS version of patchmanager/versions"
        required: true
        type: string
      sdk-target:
        description: "The SDK build target our QML is compiled with; empty when the series has none"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  hook:
    name: Hook on ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The hook against the stock home screen
        env:
          SAILFISH_VERSION: ${{ inputs.version }}
        run: make check-hook VERSION="$SAILFISH_VERSION"

  qml:
    name: QML with the ${{ inputs.sdk-target }} SDK target
    if: inputs.sdk-target != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: out/sdk/${{ inputs.sdk-target }}
          key: sdk-target-${{ inputs.sdk-target }}-${{ hashFiles('scripts/qml-check.sh') }}
      - name: Our QML with that release's Qt and Silica
        env:
          SDK_TARGET: ${{ inputs.sdk-target }}
        run: make qml-check TARGET="$SDK_TARGET"
