# Sailfish OS 5.1.0.11, in the testers' package and checked by CI only: the hook against its stock home screen, and
# our QML compiled with its SDK target's Qt and Silica. A workflow of its own for its own status badge in README.md;
# the steps are in sailfish.yml.
name: Sailfish OS 5.1.0.11

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sailfish-5.1.0.11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/sailfish.yml
    with:
      version: "5.1.0.11"
      sdk-target: "5.1.0.11"
