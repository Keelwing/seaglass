# Publish the site on GitHub Pages (docs/DEVELOPMENT.md): the landing page, the docs and the images, built by
# make site. On every push to main that changes them, or by hand. GitHub Pages must be on, with "GitHub Actions" as
# its source (Settings → Pages; on a free plan, only for a public repository), and the repository variable
# PAGES_ENABLED set to true (Settings → Secrets and variables → Actions → Variables). Until then the run is skipped.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "icons/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
      - "patchmanager/patch.json"
      - "scripts/site.*"
      - "docker/Dockerfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Site
        run: make site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
