# Sailfish OS 5.2.0.18, a release version (listed in patch.json): the hook against its stock home screen. Jolla
# publishes no SDK target for 5.2, so our QML is checked on a phone. A workflow of its own for its own status badge in
# README.md; the steps are in sailfish.yml.
name: Sailfish OS 5.2.0.18

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sailfish-5.2.0.18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/sailfish.yml
    with:
      version: "5.2.0.18"
