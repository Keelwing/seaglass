# Sailfish OS 5.0.0.78, in the testers' package and checked by CI only: the hook against its stock home screen, and
# our QML compiled with the 5.0.0.62 SDK target, the series' own. A workflow of its own for its own status badge in
# README.md; the steps are in sailfish.yml.
name: Sailfish OS 5.0.0.78

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sailfish-5.0.0.78-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/sailfish.yml
    with:
      version: "5.0.0.78"
      sdk-target: "5.0.0.62"
