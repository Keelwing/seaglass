<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The GitHub preview (docs/BRAND.md): the icon, the name and the description, and two screenshots. scripts/social.sh
       renders it next to seaglass.svg, widgets.jpg and switcher.jpg, with Albert Sans from the site. -->
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bbfae"/>
      <stop offset="0.45" stop-color="#0f6e78"/>
      <stop offset="1" stop-color="#1a2f78"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenA"><rect x="772" y="62" width="216" height="476" rx="24"/></clipPath>
    <clipPath id="screenB"><rect x="1018" y="102" width="216" height="476" rx="24"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M-20 560C220 500 420 580 660 520S1060 470 1300 500V660H-20Z" fill="#ffffff" opacity="0.07"/>
  <path d="M-20 610C260 560 480 630 720 580S1100 540 1300 560V660H-20Z" fill="#ffffff" opacity="0.06"/>

  <image x="88" y="104" width="196" height="196" xlink:href="seaglass.svg"/>
  <text x="96" y="420" font-family="Albert Sans" font-weight="500" font-size="112" fill="#ffffff">Seaglass</text>
  <text x="100" y="484" font-family="Albert Sans" font-weight="400" font-size="40" fill="#ffffff" fill-opacity="0.85">Home screen extensions</text>
  <text x="100" y="534" font-family="Albert Sans" font-weight="400" font-size="40" fill="#ffffff" fill-opacity="0.85">for Sailfish OS</text>

  <rect x="760" y="50" width="240" height="500" rx="34" fill="#f3fbf9"/>
  <image x="772" y="62" width="216" height="476" preserveAspectRatio="xMidYMid slice" xlink:href="widgets.jpg" clip-path="url(#screenA)"/>
  <rect x="1006" y="90" width="240" height="500" rx="34" fill="#f3fbf9"/>
  <image x="1018" y="102" width="216" height="476" preserveAspectRatio="xMidYMid slice" xlink:href="switcher.jpg" clip-path="url(#screenB)"/>
</svg>
